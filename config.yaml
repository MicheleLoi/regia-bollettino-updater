# regia-bollettino-updater config
# Edit this file to configure your seed repositories and thresholds.

seeds:
  - owner: example-org      # placeholder; il founder configura il vero seed prima del primo scan
    name: legal-ai-tool
    follow_forks: true
  # Aggiungi ulteriori seed qui:
  # - owner: another-org
  #   name: another-repo
  #   follow_forks: false

threshold_policy:
  # Soglia per is_active: un repo con last_activity piu' vecchia di questo numero di giorni
  # viene marcato is_active: false
  active_window_days: 90
  # Soglie per warning su large changes (review step)
  warn_repos_changed_pct: 30   # >30% repos changed rispetto al bollettino precedente → warning
  warn_new_patterns_count: 5   # >5 nuovi pattern rispetto al bollettino precedente → warning
  warn_skills_changed_count: 3  # >3 skill changes (add/remove/update) → warning conferma typed
  # Finestra di validita' del review flag (minuti): publish rifiuta se review e' piu' vecchio
  review_flag_max_age_minutes: 120

env_vars:
  github_token: GITHUB_TOKEN
  vps_host: VPS_HOST
  vps_user: VPS_USER
  vps_path: VPS_PATH
  vps_key_path: VPS_KEY_PATH

output:
  raw_dir: output/raw
  ecosystem_path: output/bulletin_ecosystem.json
  patterns_path: output/bulletin_patterns.json
  skills_path: output/bulletin_skills.json
  previous_suffix: .previous.json
  review_flag_path: output/.review_flag

skill_sources:
  # Placeholder — founder configura sources reali prima del primo scan production.
  # Formato: { owner, name, default_tier (1 o 2), default_jurisdiction (IT/EU/[?]/other) }
  # Il campo default_tier e default_jurisdiction vengono usati come fallback se SKILL.md
  # non dichiara esplicitamente tier/jurisdiction nel frontmatter YAML.
  #
  # Esempio (decommentare e adattare):
  # - owner: anthropics
  #   name: claude-skills
  #   default_tier: 1
  #   default_jurisdiction: "[?]"
  # - owner: TerminalSkills
  #   name: skills
  #   default_tier: 2
  #   default_jurisdiction: "[?]"
