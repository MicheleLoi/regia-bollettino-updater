# regia-bollettino-updater config
# Edit this file to configure your seed repositories and thresholds.

seeds:
  # Seed canonico: willchen96/mike (Mike OSS, ~3.1k stars, AGPL-3.0) + fork principali
  # nazionali documentati in MHC-Work notes/research/mhc-l/license_audit_closure_20260510.md.
  # follow_forks: true → scan paginates fork list di Mike (~915 fork) e raccoglie
  # metadata. Refactor incrementale in roadmap: first scan = full (~30-60 min, ~2755
  # API calls), subsequent scan = solo fork nuovi (delta vs state file).
  - owner: willchen96
    name: mike
    follow_forks: true
  # Fork nazionali noti elencati esplicitamente (li scopre comunque via follow_forks di mike,
  # ma elencarli rende il bollettino deterministico se la fork list di GitHub cambia):
  - owner: rafal-fryc
    name: mikelocal
    follow_forks: false
  - owner: jamietso
    name: mike-redline
    follow_forks: false
  - owner: Jeroen1991z
    name: mikeNL
    follow_forks: false
  - owner: veronica-builds
    name: emilie
    follow_forks: false
  - owner: AlexAlves87
    name: ContextSafe
    follow_forks: false

threshold_policy:
  # Soglia per is_active: un repo con last_activity piu' vecchia di questo numero di giorni
  # viene marcato is_active: false
  active_window_days: 90
  # Soglie per warning su large changes (review step)
  warn_repos_changed_pct: 30   # >30% github_scanned repos changed → warning
  warn_new_patterns_count: 5   # >5 nuovi pattern → warning
  warn_skills_changed_count: 3  # >3 skill changes (add/remove/update) → warning conferma typed
  warn_human_picks_changed_count: 3  # >3 human picks add/remove/changed → warning (absolute count, set piccolo)
  # Finestra di validita' del review flag (minuti): publish rifiuta se review e' piu' vecchio
  review_flag_max_age_minutes: 120

env_vars:
  github_token: GITHUB_TOKEN
  vps_host: VPS_HOST
  vps_user: VPS_USER
  vps_path: VPS_PATH
  vps_key_path: VPS_KEY_PATH

output:
  raw_dir: output/raw
  ecosystem_path: output/bulletin_ecosystem.json
  patterns_path: output/bulletin_patterns.json
  skills_path: output/bulletin_skills.json
  previous_suffix: .previous.json
  review_flag_path: output/.review_flag

skill_sources:
  # Repo Anthropic-official verified (gh api 2026-05-20). Tier 1 (Anthropic publisher).
  # default_jurisdiction "[?]" — i repo aggregano skill di vari domini; il scan estrae
  # eventuali tier/jurisdiction override dal frontmatter SKILL.md per skill specifiche.
  #
  # NOTA architetturale: questi repo sono MARKETPLACE containers (SKILL.md vivono nelle
  # sotto-cartelle dei singoli plugin, non al root). Lo scan corrente cerca SKILL.md
  # al root del repo — quindi otterrà metadata + README + LICENSE ma NON tier/jurisdiction
  # da SKILL.md. Fine per Phase II — refactor per scan multi-skill via sub-folder è
  # roadmap future enhancement.
  - owner: anthropics
    name: claude-for-legal
    default_tier: 1
    default_jurisdiction: "[?]"
  - owner: anthropics
    name: skills
    default_tier: 1
    default_jurisdiction: "[?]"
  - owner: anthropics
    name: knowledge-work-plugins
    default_tier: 1
    default_jurisdiction: "[?]"

human_picks:
  # Sorgenti curate manualmente dal founder (URL siti, articoli, prodotti) che si
  # affiancano allo scan automatico GitHub MikeOSS. Ogni entry e' un'aggiunta
  # editoriale: il bollettino diventa knowledge product curato, non aggregatore
  # meccanico. Le skill BeccarIA distinguono le fonti via source_type nella
  # risposta all'avvocato ("Dall'ecosistema GitHub..." vs "Dalla curation del fornitore...").
  #
  # Schema voce:
  #   url:                    HTTPS URL della sorgente (obbligatorio)
  #   topic:                  Titolo curatoriale breve (obbligatorio)
  #   notes:                  Rationale del founder al momento della curation (multiline)
  #   added_date:             ISO 8601 date (YYYY-MM-DD)
  #   tags:                   Flat list di tag (orthogonal a inferred_capabilities)
  #   inferred_jurisdiction:  Override opzionale ("IT"/"EU"/"US"/"UK"/...). Default "Unknown".
  #   license:                Licenza opzionale. Default "Unknown".
  - url: https://suzielaw.com/
    topic: "Open-core legal AI workspace UK"
    notes: |
      Pattern open-core + servizi managed legal (Scissero, Mathias Strasser).
      Validazione architettonica del modello RegIA: 'baseline legal AI should be
      free' + servizi commerciali a valore aggiunto da law firm regolamentata.
      Lanciato maggio 2026.
    added_date: 2026-05-22
    tags: [open-core, uk, managed-legal-services, pattern-validation]
    inferred_jurisdiction: UK
    license: "(proprietary)"
