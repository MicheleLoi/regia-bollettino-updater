# regia-bollettino-updater config
# Edit this file to configure your seed repositories and thresholds.

seeds:
  # Seed canonico: willchen96/mike (Mike OSS, ~3.1k stars, AGPL-3.0) + fork principali
  # nazionali documentati in MHC-Work notes/research/mhc-l/license_audit_closure_20260510.md.
  # follow_forks: true → scan paginates fork list di Mike (~915 fork) e raccoglie
  # metadata. Refactor incrementale in roadmap: first scan = full (~30-60 min, ~2755
  # API calls), subsequent scan = solo fork nuovi (delta vs state file).
  - owner: willchen96
    name: mike
    follow_forks: true
  # Fork nazionali noti elencati esplicitamente (li scopre comunque via follow_forks di mike,
  # ma elencarli rende il bollettino deterministico se la fork list di GitHub cambia):
  - owner: rafal-fryc
    name: mikelocal
    follow_forks: false
  - owner: jamietso
    name: mike-redline
    follow_forks: false
  - owner: Jeroen1991z
    name: mikeNL
    follow_forks: false
  - owner: veronica-builds
    name: emilie
    follow_forks: false
  - owner: AlexAlves87
    name: ContextSafe
    follow_forks: false

threshold_policy:
  # Soglia per is_active: un repo con last_activity piu' vecchia di questo numero di giorni
  # viene marcato is_active: false
  active_window_days: 90
  # Soglie per warning su large changes (review step)
  warn_repos_changed_pct: 30   # >30% github_scanned repos changed → warning
  warn_new_patterns_count: 5   # >5 nuovi pattern → warning
  warn_skills_changed_count: 3  # >3 skill changes (add/remove/update) → warning conferma typed
  warn_human_picks_changed_count: 3  # >3 human picks add/remove/changed → warning (absolute count, set piccolo)
  # Finestra di validita' del review flag (minuti): publish rifiuta se review e' piu' vecchio
  review_flag_max_age_minutes: 120

env_vars:
  github_token: GITHUB_TOKEN
  vps_host: VPS_HOST
  vps_user: VPS_USER
  vps_path: VPS_PATH
  vps_key_path: VPS_KEY_PATH

output:
  raw_dir: output/raw
  ecosystem_path: output/bulletin_ecosystem.json
  patterns_path: output/bulletin_patterns.json
  skills_path: output/bulletin_skills.json
  previous_suffix: .previous.json
  review_flag_path: output/.review_flag

skill_sources:
  # Repo Anthropic-official verified (gh api 2026-05-20). Tier 1 (Anthropic publisher).
  # default_jurisdiction "[?]" — i repo aggregano skill di vari domini; il scan estrae
  # eventuali tier/jurisdiction override dal frontmatter SKILL.md per skill specifiche.
  #
  # NOTA architetturale: questi repo sono MARKETPLACE containers (SKILL.md vivono nelle
  # sotto-cartelle dei singoli plugin, non al root). Lo scan corrente cerca SKILL.md
  # al root del repo — quindi otterrà metadata + README + LICENSE ma NON tier/jurisdiction
  # da SKILL.md. Fine per Phase II — refactor per scan multi-skill via sub-folder è
  # roadmap future enhancement.
  - owner: anthropics
    name: claude-for-legal
    default_tier: 1
    default_jurisdiction: "[?]"
  - owner: anthropics
    name: skills
    default_tier: 1
    default_jurisdiction: "[?]"
  - owner: anthropics
    name: knowledge-work-plugins
    default_tier: 1
    default_jurisdiction: "[?]"

human_picks:
  # Sorgenti curate manualmente dal founder (URL siti, articoli, prodotti) che si
  # affiancano allo scan automatico GitHub MikeOSS. Ogni entry e' un'aggiunta
  # editoriale: il bollettino diventa knowledge product curato, non aggregatore
  # meccanico. Le skill BeccarIA distinguono le fonti via source_type nella
  # risposta all'avvocato ("Dall'ecosistema GitHub..." vs "Dalla curation del fornitore...").
  #
  # Schema voce:
  #   url:                    HTTPS URL della sorgente (obbligatorio)
  #   topic:                  Titolo curatoriale breve (obbligatorio)
  #   notes:                  Rationale del founder al momento della curation (multiline)
  #   added_date:             ISO 8601 date (YYYY-MM-DD)
  #   tags:                   Flat list di tag (orthogonal a inferred_capabilities)
  #   inferred_jurisdiction:  Override opzionale ("IT"/"EU"/"US"/"UK"/...). Default "Unknown".
  #   license:                Licenza opzionale. Default "Unknown".
  - url: https://suzielaw.com/
    topic: "Open-core legal AI workspace UK"
    notes: |
      Pattern open-core + servizi managed legal (Scissero, Mathias Strasser).
      Validazione architettonica del modello RegIA: 'baseline legal AI should be
      free' + servizi commerciali a valore aggiunto da law firm regolamentata.
      Lanciato maggio 2026.
    added_date: 2026-05-22
    tags: [open-core, uk, managed-legal-services, pattern-validation]
    inferred_jurisdiction: UK
    license: "(proprietary)"

  - url: https://legaldatahunter.com/
    topic: "Multi-jurisdiction legal corpus indexing (18M doc, 110+ paesi, MCP server)"
    notes: |
      Layer di infrastruttura dati: indicizza fonti legali primarie
      (giurisprudenza, legislazione, regolamenti) cross-jurisdiction. Espone
      l'intero dataset via MCP server. Italia coperta 22/25 fonti.
      Founder: Zacharie (zacharie@goodlegal.fr).

      Modello open-core: i dati legali sottostanti sono pubblici/gratuiti;
      LDH si fa pagare per il servizio di standardizzazione hostato. Gli
      script di raccolta + normalizzazione sono pubblicati AGPL-3.0 su
      worldwidelaw/legal-sources (244 stars). Script italiani gia'
      presenti: CassazioneCivile/Lavoro/Tributaria, ConsiglioDiStato,
      CorteCostituzionale, GarantePrivacy, GazzettaUfficiale, AGCM, AGCOM,
      ARERA, CONSOB, AgenziaEntrate, BDP-Giustizia e altri.

      Tre modi di accedere: (1) Free tier API 20 req/giorno $0;
      (2) self-host degli script AGPL su propria infrastruttura
      (license-coerente con plugin AGPL, no fee LDH); (3) Dev/Pro tier
      API $39-104/mo per uso intenso senza ops. Enterprise on-premise
      1000 EUR+/mo.
    added_date: 2026-05-23
    tags: [data-infrastructure, multi-jurisdiction, mcp-server, agpl-scripts-open, integration-target]
    inferred_jurisdiction: EU
    license: "(API proprietary; worldwidelaw/legal-sources scripts AGPL-3.0)"

  - url: https://lawve.ai/en
    topic: "Hub skill legali AI cross-jurisdiction (partnership Anthropic ufficiale)"
    notes: |
      Marketplace/catalogo curato di skill legali AI (formato SKILL.md
      compatibile Claude/ChatGPT/Gemini). Rebrand recente Lawvable -> Lawve AI
      con partnership Anthropic dichiarata: canale ufficiale di distribuzione
      skill legali per ecosistema Anthropic. Licenze accettate: MIT, Apache
      2.0, AGPL, others. Authors da Baker McKenzie, Clifford Chance, Simmons
      & Simmons, Capgemini, Maastricht University. Catalogo italiano
      attualmente vuoto -- opportunita' di country lead. Founders: Malik
      Taiar + Antoine Louis. Contribuzione community via GitHub.
    added_date: 2026-05-23
    tags: [distribution-hub, anthropic-partnership, multi-vendor-ai, italian-catalog-empty, distribution-target]
    inferred_jurisdiction: EU
    license: "(proprietary platform; single skill licensable individually)"

  - url: https://micheleloi.pro/beccaria/
    topic: "BeccarIA — skill legal-AI per avvocato italiano (workflow layer RegIA, AGPL)"
    notes: |
      Plugin Claude pubblicato dal curator stesso di questo bollettino
      (Michele Loi, RegIA). Bundle modulare di sei skill italiane:
      verifica-fonti (live WebFetch su 10+ registri authoritative IT/EU),
      catalogo, ecosystem-scout (la skill che sta leggendo ora questa
      entry), skill-installer, adattamento-italiano, pattern-extractor.
      Workflow layer IT-specific sopra ecosistemi dati (es. Legal Data
      Hunter) e hub di distribuzione skill (es. Lawve AI).
      Repo source: github.com/MicheleLoi/legal-tech-cowork.

      Self-reference editoriale: il bollettino include BeccarIA per
      coerenza — l'avvocato che interroga "che strumenti legal-AI esistono
      per Italia?" deve trovare anche lo strumento che sta usando per
      interrogare. Il curator e' lo stesso founder dello strumento,
      dichiarato apertamente. AGPL-3.0 puro: derivate devono mantenere AGPL.
    added_date: 2026-05-23
    tags: [italian-niche, workflow-skill-bundle, agpl-pure, regia-suite, self-reference]
    inferred_jurisdiction: IT
    license: AGPL-3.0-only

  - url: https://bettercallclaude.it/
    topic: "BetterCallClaude Italia — 20 agenti legal AI per avvocato italiano (fork IT dedicato di BCC, AGPL dichiarata)"
    notes: |
      Adattamento italiano dedicato di BetterCallClaude (Federico Cesconi,
      fedec65 — stesso publisher del BCC Svizzero multilingue
      fedec65/bettercallmitch). Repo fresco creato 2026-05-19, ultimo push
      2026-05-24. Brand position: "Un team di avvocati AI. Nato per
      l'Italia. Dentro Claude".

      Features dichiarate (sito + README):
      - 20 agenti legali specializzati (ricerca giuridica, strategia,
        compliance, redazione atti)
      - Copertura 20 regioni italiane + livello nazionale
      - 6 connettori MCP a banche dati ufficiali italiane (Cassazione,
        Normattiva, Gazzetta Ufficiale)
      - 30 slash command personalizzati
      - Privacy-first: elaborazione LLM locale con Ollama (no cloud calls)
      - GDPR + Codice Privacy compliant by design
      - Audience target: avvocati italiani (Foro Milano/Roma/Torino,
        civilisti)

      Repo: github.com/fedec65/bettercallclaude_italia
      Distinct dall'entry scanned-ecosystem fedec65/bettercallmitch (Swiss
      multilingue de/fr/it/en, Unknown jurisdiction per heuristic gap) —
      bettercallclaude_italia e' il branch italiano dedicato, repo
      separato + struttura .claude-plugin con MCP connectors IT-specific.

      AVVISO LICENSE GAP (importante per studio legale che valuta uso):
      sito dichiara "AGPL v3 Open Source" ma il repo GitHub NON ha un
      file LICENSE al root (verifica `gh api repos/fedec65/bettercallclaude_italia/contents/LICENSE`
      → 404). License SPDX in metadata `null`. Implicazione legale:
      senza LICENSE file esplicito il codice e' default proprietario;
      l'avvocato che vuole installare/derivare dovrebbe chiedere al
      maintainer chiarimento + commit di un file LICENSE prima di uso
      commerciale per il proprio studio. Risolvibile in 5 minuti dal
      maintainer ma non risolto al 2026-05-27.

      Posizionamento vs concorrenza diretta: pattern complementare a
      BeccarIA (BeccarIA = workflow layer + adapt italiano di skill
      terze; BetterCallClaude Italia = stand-alone agentic platform
      italiana gia' adapted). Overlap parziale su audience (avvocato
      italiano). Differenza scope: BCC Italia offre 20 agenti integrati
      bundled; BeccarIA offre infrastruttura adattamento+verifica per
      skill di terzi che l'avvocato sceglie. L'avvocato puo' usare
      entrambi.

      Reputation indicators al 2026-05-27: 0 stars, 0 forks, sole-dev
      (Cesconi). Threshold standard scan-tier fallirebbe (richiede
      ≥50 stars o whitelist publisher); incluso come human_pick per
      decisione editoriale founder (Michele Loi) — la reputation indiretta
      del publisher (BCC Swiss precedente) + l'IT-focus immediato lo
      rendono signal rilevante per l'avvocato italiano nonostante
      l'assenza di validazione community attuale.
    added_date: 2026-05-27
    tags: [italian-niche, agentic-legal-ai, agpl-dichiarata, mcp-connectors-italian, privacy-local-ollama, cesconi, license-gap, fresh-2026]
    inferred_jurisdiction: IT
    license: "AGPL-3.0-only (dichiarata sul sito; LICENSE file assente nel repo al 2026-05-27)"
